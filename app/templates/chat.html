<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pitchside Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101820;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 20px;
            background: #17232e;
            border-bottom: 1px solid #30404d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header a {
            color: #80e0a7;
            text-decoration: none;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .chat-panel {
            background: #17232e;
            border: 1px solid #30404d;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-heading {
            padding: 18px;
            border-bottom: 1px solid #30404d;
        }

        .chat-heading h2 {
            margin: 0 0 6px;
        }

        .chat-heading p {
            margin: 0;
            color: #aab8c4;
            font-size: 14px;
        }

        /* Online supporters section */

        .online-panel {
            background: #17202b;
            border-bottom: 1px solid #30404d;
            padding: 14px 18px;
        }

        .online-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .online-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        #online-users {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #online-users li {
            background: #253447;
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #online-users li.online-empty {
            color: #aab6c5;
            background: transparent;
            padding-left: 0;
        }

        /* Chat messages */

        #messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 55vh;
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
            overflow-wrap: anywhere;
        }

        .message.own-message {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.other-message {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-name {
            color: #b8c7d5;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 0 8px;
        }

        .own-message .message-name {
            color: #80e0a7;
        }

        .message-text {
            background: #263746;
            color: #ffffff;
            padding: 11px 15px;
            border-radius: 16px 16px 16px 4px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .own-message .message-text {
            background: #167d54;
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
        }

        .message-time {
            color: #8999a7;
            font-size: 11px;
            margin-top: 5px;
            padding: 0 8px;
        }

        #empty-state {
            color: #aab8c4;
            text-align: center;
            margin-top: 70px;
        }

        /* Message form */

        #chat-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #30404d;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #40515f;
            border-radius: 8px;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        #send-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #80e0a7;
            color: #101820;
            font-weight: bold;
            cursor: pointer;
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            padding: 0 15px 12px;
            color: #aab8c4;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            main {
                margin: 12px auto;
                padding: 0 10px;
            }

            #messages {
                height: 60vh;
                padding: 14px;
                gap: 14px;
            }

            .message {
                max-width: 88%;
            }

            .message-text {
                padding: 10px 13px;
                font-size: 14px;
            }

            #chat-form {
                padding: 10px;
            }

            #send-button {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>⚽ Pitchside</h1>
        <a href="/">Back to home</a>
    </header>

    <main>
        <section class="chat-panel">

            <div class="chat-heading">
                <h2>Supporters' Chat</h2>
                <p>Talk football with other Pitchside supporters.</p>
            </div>

            <!-- Online supporters are separate from the messages container -->
            <section class="online-panel">
                <div class="online-heading">
                    <span class="online-dot"></span>
                    Active Supporters
                </div>

                <ul id="online-users" aria-live="polite">
                    <li class="online-empty">Connecting...</li>
                </ul>
            </section>

            <!-- Only chat messages belong inside this container -->
            <div id="messages" aria-live="polite">
                <p id="empty-state">Loading messages...</p>
            </div>

            <form id="chat-form">
                <input
                    id="message-input"
                    type="text"
                    maxlength="1000"
                    placeholder="Write a message..."
                    autocomplete="off"
                    required
                >

                <button id="send-button" type="submit" disabled>
                    Send
                </button>
            </form>

            <div id="status" role="status" aria-live="polite">
                Connecting to chat...
            </div>

        </section>
    </main>

    <script>
        const messagesContainer = document.getElementById("messages");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const statusElement = document.getElementById("status");
        const onlineUsersContainer = document.getElementById("online-users");

        const currentUsername = {{ username | tojson }};

        let socket = null;
        let reconnectTimer = null;
        let manuallyClosed = false;
        let reconnectAttempts = 0;

        const displayedMessageIds = new Set();

        /* Display one chat message. */

        function addMessage(message) {
            if (displayedMessageIds.has(message.id)) {
                return;
            }

            displayedMessageIds.add(message.id);

            const empty = document.getElementById("empty-state");

            if (empty) {
                empty.remove();
            }

            const wrapper = document.createElement("div");

            wrapper.className =
                message.username === currentUsername
                    ? "message own-message"
                    : "message other-message";

            const name = document.createElement("div");
            name.className = "message-name";

            name.textContent =
                message.username === currentUsername
                    ? "You"
                    : message.username;

            const text = document.createElement("div");
            text.className = "message-text";
            text.textContent = message.message;

            const time = document.createElement("div");
            time.className = "message-time";

            time.textContent = new Date(
                message.created_at
            ).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

            wrapper.append(name, text, time);
            messagesContainer.appendChild(wrapper);

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;
        }

        /* Show a message when the chat history is empty. */

        function showEmptyState() {
            if (messagesContainer.children.length > 0) {
                return;
            }

            const empty = document.createElement("p");

            empty.id = "empty-state";
            empty.textContent =
                "No messages yet. Start the conversation!";

            messagesContainer.appendChild(empty);
        }

        /* Update the online supporters list. */

        function renderOnlineUsers(users) {
            onlineUsersContainer.replaceChildren();

            if (!Array.isArray(users) || users.length === 0) {
                const empty = document.createElement("li");

                empty.className = "online-empty";
                empty.textContent = "No supporters online.";

                onlineUsersContainer.appendChild(empty);
                return;
            }

            for (const username of users) {
                const item = document.createElement("li");

                item.textContent = username;
                onlineUsersContainer.appendChild(item);
            }
        }

        /* Connect to the WebSocket server. */

        function connectWebSocket() {
            manuallyClosed = false;

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            const socketUrl =
                `${protocol}//${window.location.host}/ws/chat`;

            statusElement.textContent = "Connecting to chat...";
            sendButton.disabled = true;

            socket = new WebSocket(socketUrl);

            socket.addEventListener("open", function () {
                reconnectAttempts = 0;

                statusElement.textContent = "Connected";
                sendButton.disabled = false;
            });

            socket.addEventListener("message", function (event) {
                let data;

                try {
                    data = JSON.parse(event.data);
                } catch {
                    statusElement.textContent =
                        "Received an invalid server response.";
                    return;
                }

                /* Online-status updates */
                if (data.type === "presence") {
                    renderOnlineUsers(data.users);
                    return;
                }

                /* Initial chat history */
                if (data.type === "history") {
                    messagesContainer.replaceChildren();
                    displayedMessageIds.clear();

                    for (const message of data.messages) {
                        addMessage(message);
                    }

                    showEmptyState();
                    return;
                }

                /* New chat message */
                if (data.type === "message") {
                    addMessage(data.message);
                    return;
                }

                /* Server-side validation errors */
                if (data.type === "error") {
                    statusElement.textContent =
                        data.detail || "Unable to process message.";
                }
            });

            socket.addEventListener("error", function () {
                statusElement.textContent =
                    "Chat connection problem. Reconnecting...";
            });

            socket.addEventListener("close", function (event) {
                sendButton.disabled = true;

                if (manuallyClosed) {
                    return;
                }

                if (event.code === 4401) {
                    window.location.href =
                        "/auth/login?next=/chat";
                    return;
                }

                statusElement.textContent =
                    "Disconnected. Reconnecting...";

                const delay = Math.min(
                    1000 * (2 ** reconnectAttempts),
                    15000
                );

                reconnectAttempts++;

                reconnectTimer = setTimeout(
                    connectWebSocket,
                    delay
                );
            });
        }

        /* Send a chat message. */

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const message = input.value.trim();

            if (!message) {
                return;
            }

            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN
            ) {
                statusElement.textContent =
                    "Not connected. Please wait for reconnection.";
                return;
            }

            socket.send(JSON.stringify({
                message: message
            }));

            input.value = "";
            input.focus();
        });

        connectWebSocket();

        /* Close the connection when leaving the page. */

        window.addEventListener("beforeunload", function () {
            manuallyClosed = true;

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }

            if (socket) {
                socket.close();
            }
        });
    </script>
</body>
</html>
