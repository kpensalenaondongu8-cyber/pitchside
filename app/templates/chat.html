<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pitchside Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101820;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px 20px;
            background: #17232e;
            border-bottom: 1px solid #30404d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header a {
            color: #80e0a7;
            text-decoration: none;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .chat-panel {
            background: #17232e;
            border: 1px solid #30404d;
            border-radius: 12px;
            overflow: hidden;
        }

        .chat-heading {
            padding: 18px;
            border-bottom: 1px solid #30404d;
        }

        .chat-heading h2 {
            margin: 0 0 6px;
        }

        .chat-heading p {
            margin: 0;
            color: #aab8c4;
            font-size: 14px;
        }

        /* Online supporters section */

        .online-panel {
            background: #17202b;
            border-bottom: 1px solid #30404d;
            padding: 14px 18px;
        }

        .online-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .online-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        #online-users {
            display: flex;
            flex-direction: column;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #online-users li {
            background: #253447;
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        #online-users li.online-empty {
            color: #aab6c5;
            background: transparent;
            padding-left: 0;
        }

        /* Individual supporters */

        .supporter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #2b3545;
        }

        .supporter-info {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .supporter-status {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .supporter-status.online {
            background: #22c55e;
        }

        .supporter-status.offline {
            background: #94a3b8;
        }

        .supporter-name {
            color: #80e0a7;
            text-decoration: none;
            font-weight: bold;
            overflow-wrap: anywhere;
            cursor: pointer;
        }

        .supporter-name:hover {
            color: #bbf7d0;
            text-decoration: underline;
        }

        .supporter-state {
            display: block;
            margin-top: 3px;
            color: #94a3b8;
            font-size: 12px;
        }

        .message-user-button {
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            background: #f97316;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
        }

        .message-user-button:hover {
            background: #ea580c;
        }

        /* Chat messages */

        #messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 55vh;
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
            overflow-wrap: anywhere;
        }

        .message.own-message {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.other-message {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-name {
            color: #b8c7d5;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            padding: 0 8px;
        }

        .own-message .message-name {
            color: #80e0a7;
        }

        .message-text {
            background: #263746;
            color: #ffffff;
            padding: 11px 15px;
            border-radius: 16px 16px 16px 4px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .own-message .message-text {
            background: #167d54;
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
        }

        .message-time {
            color: #8999a7;
            font-size: 11px;
            margin-top: 5px;
            padding: 0 8px;
        }

        #empty-state {
            color: #aab8c4;
            text-align: center;
            margin-top: 70px;
        }

        /* Message form */

        #chat-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #30404d;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #40515f;
            border-radius: 8px;
            background: #101820;
            color: white;
            font-size: 16px;
        }

        #send-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #80e0a7;
            color: #101820;
            font-weight: bold;
            cursor: pointer;
        }

        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            padding: 0 15px 12px;
            color: #aab8c4;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            main {
                margin: 12px auto;
                padding: 0 10px;
            }

            #messages {
                height: 60vh;
                padding: 14px;
                gap: 14px;
            }

            .message {
                max-width: 88%;
            }

            .message-text {
                padding: 10px 13px;
                font-size: 14px;
            }

            #chat-form {
                padding: 10px;
            }

            #send-button {
                padding: 12px;
            }

            .message-user-button {
                padding: 7px 10px;
            }
        }
       .message.deleted .message-text {
    font-style: italic;
    opacity: 0.7;
    background: transparent;
    border: 1px dashed #40515f;
}

.delete-button {
    margin-top: 2px;
    padding: 6px 8px;
    background: none;
    border: 0;
    color: #8999a7;
    font-size: 11px;
    cursor: pointer;
}

.delete-button:hover {
    color: #ff8a80;
} 
    </style>
</head>

<body>
    <header>
        <h1>⚽ Pitchside</h1>
        <a href="/">Back to home</a>
    </header>

    <main>
        <section class="chat-panel">

            <div class="chat-heading">
                <h2>Supporters' Chat</h2>
                <p>Talk football with other Pitchside supporters.</p>
            </div>

            <!-- Supporters list -->
            <section class="online-panel">
                <div class="online-heading">
                    <span class="online-dot"></span>
                    Pitchside Supporters
                </div>

                <ul id="online-users" aria-live="polite">
                    <li class="online-empty">
                        Loading supporters...
                    </li>
                </ul>
            </section>

            <!-- Group chat messages -->
            <div id="messages" aria-live="polite">
                <p id="empty-state">Loading messages...</p>
            </div>

            <!-- Group chat form -->
            <form id="chat-form">
                <input
                    id="message-input"
                    type="text"
                    maxlength="1000"
                    placeholder="Write a message..."
                    autocomplete="off"
                    required
                >

                <button id="send-button" type="submit" disabled>
                    Send
                </button>
            </form>

            <div id="status" role="status" aria-live="polite">
                Connecting to chat...
            </div>

        </section>
    </main>

    <script>
        const messagesContainer = document.getElementById("messages");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const statusElement = document.getElementById("status");
        const onlineUsersContainer = document.getElementById("online-users");

        const currentUsername = {{ username | tojson }};

        let socket = null;
        let reconnectTimer = null;
        let manuallyClosed = false;
        let reconnectAttempts = 0;

        const displayedMessageIds = new Set();

        /*
         * Open a private conversation with a selected supporter.
         * The user's ID identifies the correct account.
         */
        function openPrivateChat(userId) {
            if (userId === undefined || userId === null) {
                console.error("The selected user has no ID.");
                return;
            }

            window.location.href =
                `/private/messages?user_id=${encodeURIComponent(userId)}`;
        }

        /* Display one group chat message. */
               const messageElements = new Map();   // message id -> its elements
        let newestShown = 0;
        let seenTimer = null;

        /* Tell the server which message we have displayed (only while the page is visible). */
        function reportSeen() {
            if (document.hidden || newestShown === 0 || seenTimer) {
                return;
            }

            seenTimer = setTimeout(async function () {
                seenTimer = null;

                if (document.hidden) {
                    return;
                }

                try {
                    await fetch("/chat/read", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ last_id: newestShown })
                    });
                } catch (error) {
                    /* The next message tries again. */
                }
            }, 400);
        }

        function showDeleted(entry, deletedByMe, name) {
            entry.text.textContent = deletedByMe
                ? "You deleted this message"
                : name + " deleted this message";

            entry.wrapper.classList.add("deleted");

            if (entry.deleteButton) {
                entry.deleteButton.remove();
                entry.deleteButton = null;
            }
        }

        function markDeleted(id, name) {
            const entry = messageElements.get(id);

            if (entry) {
                showDeleted(entry, name === currentUsername, name);
            }
        }

        function removeMessageFromView(id) {
            const entry = messageElements.get(id);

            if (entry) {
                entry.wrapper.remove();
                messageElements.delete(id);
            }
        }

        async function sendDelete(id, scope) {
            try {
                const response = await fetch("/chat/messages/" + id + "/delete", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ scope: scope })
                });

                const data = await response.json().catch(function () { return {}; });

                return {
                    ok: response.ok,
                    status: response.status,
                    detail: typeof data.detail === "string"
                        ? data.detail
                        : "Could not delete the message."
                };
            } catch (error) {
                return { ok: false, status: 0, detail: "Could not reach the server." };
            }
        }

        async function deleteMessage(id) {
            if (!window.confirm("Delete this message?")) {
                return;
            }

            const result = await sendDelete(id, "everyone");

            if (result.ok) {
                markDeleted(id, currentUsername);
                return;
            }

            if (result.status === 409) {
                if (!window.confirm(
                    "Someone has already seen this message, so it cannot be deleted " +
                    "for everyone. Delete it just for you?"
                )) {
                    return;
                }

                const own = await sendDelete(id, "self");

                if (own.ok) {
                    removeMessageFromView(id);
                } else {
                    statusElement.textContent = own.detail;
                }

                return;
            }

            statusElement.textContent = result.detail;
        }

        /* Display one group chat message. */

        function addMessage(message) {
            if (displayedMessageIds.has(message.id)) {
                return;
            }

            displayedMessageIds.add(message.id);

            const empty = document.getElementById("empty-state");

            if (empty) {
                empty.remove();
            }

            const mine = message.username === currentUsername;

            const wrapper = document.createElement("div");

            wrapper.className = mine
                ? "message own-message"
                : "message other-message";

            const name = document.createElement("div");
            name.className = "message-name";
            name.textContent = mine ? "You" : message.username;

            const text = document.createElement("div");
            text.className = "message-text";

            const time = document.createElement("div");
            time.className = "message-time";

            time.textContent = new Date(
                message.created_at
            ).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

            wrapper.append(name, text, time);

            const entry = { wrapper: wrapper, text: text, deleteButton: null };

            if (message.deleted) {
                showDeleted(entry, mine, message.username);
            } else {
                text.textContent = message.message;

                if (mine) {
                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "delete-button";
                    remove.textContent = "Delete";
                    remove.addEventListener("click", function () {
                        deleteMessage(message.id);
                    });

                    wrapper.appendChild(remove);
                    entry.deleteButton = remove;
                }
            }

            messageElements.set(message.id, entry);
            messagesContainer.appendChild(wrapper);

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

            if (message.id > newestShown) {
                newestShown = message.id;
            }

            reportSeen();
        }

        /* Show an empty-state message when there are no messages. */

        function showEmptyState() {
            if (messagesContainer.children.length > 0) {
                return;
            }

            const empty = document.createElement("p");

            empty.id = "empty-state";
            empty.textContent =
                "No messages yet. Start the conversation!";

            messagesContainer.appendChild(empty);
        }

        /* Load and display the supporters list. */

        async function renderOnlineUsers() {
            try {
                const response = await fetch("/chat/users", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    throw new Error("Could not load supporters.");
                }

                const data = await response.json();

                onlineUsersContainer.replaceChildren();

                if (!data.users || data.users.length === 0) {
                    const emptyMessage = document.createElement("li");

                    emptyMessage.className = "online-empty";
                    emptyMessage.textContent = "No other supporters yet.";

                    onlineUsersContainer.appendChild(emptyMessage);
                    return;
                }

                for (const user of data.users) {
                    const item = document.createElement("li");
                    item.className = "supporter-item";

                    const info = document.createElement("div");
                    info.className = "supporter-info";

                    const indicator = document.createElement("span");

                    indicator.className = user.online
                        ? "supporter-status online"
                        : "supporter-status offline";

                    const details = document.createElement("div");

                    /*
                     * The username is a link.
                     * Clicking it opens a private chat with this user.
                     */
                    const name = document.createElement("a");

                    name.className = "supporter-name";
                    name.textContent = user.username;
                    name.href =
                        `/private/messages?user_id=${encodeURIComponent(user.id)}`;

                    name.title = `Send a private message to ${user.username}`;

                    const status = document.createElement("span");

                    status.className = "supporter-state";
                    status.textContent = user.online
                        ? "Online"
                        : "Offline";

                    details.append(name, status);
                    info.append(indicator, details);

                    /*
                     * The Message button opens the same private chat.
                     */
                    const button = document.createElement("button");

                    button.type = "button";
                    button.className = "message-user-button";
                    button.textContent = "Message";
                    button.title = `Message ${user.username} privately`;

                    button.addEventListener("click", function () {
                        openPrivateChat(user.id);
                    });

                    item.append(info, button);
                    onlineUsersContainer.appendChild(item);
                }
            } catch (error) {
                onlineUsersContainer.replaceChildren();

                const errorMessage = document.createElement("li");

                errorMessage.className = "online-empty";
                errorMessage.textContent =
                    "Unable to load supporters. Please refresh.";

                onlineUsersContainer.appendChild(errorMessage);

                console.error("Error loading supporters:", error);
            }
        }

        /* Connect to the group chat WebSocket. */

        function connectWebSocket() {
            manuallyClosed = false;

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            const socketUrl =
                `${protocol}//${window.location.host}/ws/chat`;

            statusElement.textContent = "Connecting to chat...";
            sendButton.disabled = true;

            socket = new WebSocket(socketUrl);

            socket.addEventListener("open", function () {
                reconnectAttempts = 0;

                statusElement.textContent = "Connected";
                sendButton.disabled = false;
            });

            socket.addEventListener("message", function (event) {
                let data;

                try {
                    data = JSON.parse(event.data);
                } catch {
                    statusElement.textContent =
                        "Received an invalid server response.";
                    return;
                }

                /* Update online supporters when presence changes. */
                if (data.type === "presence") {
                    renderOnlineUsers();
                    return;
                }

                /* Display initial group chat history. */
                if (data.type === "history") {
                    messagesContainer.replaceChildren();
                    displayedMessageIds.clear();

                    for (const message of data.messages) {
                        addMessage(message);
                    }

                    showEmptyState();
                    return;
                }

                /* Display a new group chat message. */
                if (data.type === "message") {
                    addMessage(data.message);
                    return;
                }

                /* Display server-side errors. */
                if (data.type === "error") {
                    statusElement.textContent =
                        data.detail || "Unable to process message.";
                }
            });

            socket.addEventListener("error", function () {
                statusElement.textContent =
                    "Chat connection problem. Reconnecting...";
            });

            socket.addEventListener("close", function (event) {
                sendButton.disabled = true;

                if (manuallyClosed) {
                    return;
                }

                if (event.code === 4401) {
                    window.location.href =
                        "/auth/login?next=/chat";
                    return;
                }

                statusElement.textContent =
                    "Disconnected. Reconnecting...";

                const delay = Math.min(
                    1000 * (2 ** reconnectAttempts),
                    15000
                );

                reconnectAttempts++;

                reconnectTimer = setTimeout(
                    connectWebSocket,
                    delay
                );
            });
        }

        /* Send a group chat message. */

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const message = input.value.trim();

            if (!message) {
                return;
            }

            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN
            ) {
                statusElement.textContent =
                    "Not connected. Please wait for reconnection.";
                return;
            }

            socket.send(JSON.stringify({
                message: message
            }));

            input.value = "";
            input.focus();
        });

        /* Load supporters and start the group chat. */

        renderOnlineUsers();
        connectWebSocket();

        /* Close the WebSocket when leaving the page. */

        window.addEventListener("beforeunload", function () {
            manuallyClosed = true;

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }

            if (socket) {
                socket.close();
            }
        });
    </script>
</body>
</html>
