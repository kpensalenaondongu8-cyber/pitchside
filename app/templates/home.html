<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitchside</title>
  <style>
    :root { --bg: #0b1f14; --card: #123423; --accent: #2ee66b; --text: #eef7f0; --muted: #8fb09b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 20px 16px 0; border-bottom: 1px solid #1d4a31; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header h1 span { color: var(--accent); }
    header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
    nav { display: flex; gap: 20px; margin-top: 14px; }
    nav a { color: var(--muted); text-decoration: none; padding: 8px 0; border-bottom: 3px solid transparent; font-weight: 600; }
    nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .match { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .comp { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .score { font-weight: 700; font-size: 1.2rem; }
    .badge { font-size: .75rem; font-weight: 700; }
    .badge.live { color: var(--accent); }
    .empty, .error { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Pitch<span>side</span></h1>
    <p>{{ subtitle }}</p>
    <nav>
      <a href="/" class="{{ 'active' if page == 'live' else '' }}">Live</a>
      <a href="/fixtures" class="{{ 'active' if page == 'fixtures' else '' }}">Today</a>
    </nav>
  </header>
  <main id="matches"><p class="empty">Loading matches...</p></main>

  <script>
    const ENDPOINT = {{ endpoint | tojson }};
    const EMPTY_TEXT = {{ empty_text | tojson }};
    const container = document.getElementById("matches");

    function esc(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Turn the API status into something a fan understands.
    function statusBadge(m) {
      const time = new Date(m.kickoff).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      switch (m.status) {
        case "IN_PLAY": return { text: "LIVE", live: true };
        case "PAUSED": return { text: "HALF TIME", live: true };
        case "FINISHED": return { text: "FULL TIME", live: false };
        case "SCHEDULED":
        case "TIMED": return { text: time, live: false };
        case "POSTPONED": return { text: "POSTPONED", live: false };
        default: return { text: m.status, live: false };
      }
    }

    function render(matches) {
      if (!matches.length) {
        container.innerHTML = `<p class="empty">${esc(EMPTY_TEXT)}</p>`;
        return;
      }
      container.innerHTML = matches.map(m => {
        const badge = statusBadge(m);
        return `
        <div class="match">
          <div class="comp"><span>${esc(m.competition)}</span><span class="badge ${badge.live ? "live" : ""}">${esc(badge.text)}</span></div>
          <div class="row"><span>${esc(m.home_team)}</span><span class="score">${m.home_score ?? "-"}</span></div>
          <div class="row"><span>${esc(m.away_team)}</span><span class="score">${m.away_score ?? "-"}</span></div>
        </div>`;
      }).join("");
    }

    async function load() {
      try {
        const response = await fetch(ENDPOINT);
        if (!response.ok) throw new Error("Request failed");
        render(await response.json());
      } catch (error) {
        container.innerHTML = '<p class="error">Could not load matches. Retrying...</p>';
      }
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
