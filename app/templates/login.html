<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pitchside</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        main {
            background: #1c2935;
            padding: 30px;
            border-radius: 12px;
            width: min(350px, calc(100% - 60px));
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }

        input { border: 1px solid #52616b; }

        button {
            background: #35b86b;
            color: white;
            border: 0;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; cursor: wait; }

        #message { overflow-wrap: anywhere; min-height: 20px; }
        #message.error { color: #ff8a80; }
        a { color: #65d995; }
        .password-wrap {
    position: relative;
    margin-top: 12px;
}

.password-wrap input {
    margin-top: 0;
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 6px 10px;
    background: transparent;
    color: #aab8c4;
    font-size: 18px;
}
    </style>
</head>
<body>
<main>
    <h1>Welcome Back</h1>
    <p>Log in to your Pitchside account.</p>

    <form id="login-form">
        <input
            name="username"
            placeholder="Username"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
        >

               <div class="password-wrap">
            <input
                name="password"
                type="password"
                placeholder="Password"
                minlength="8"
                maxlength="128"
                autocomplete="current-password"
                required
            >
            <button
                type="button"
                class="toggle-password"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
            >👁</button>
        </div>

        <button id="login-button" type="submit">Log in</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p>New to Pitchside? <a href="/auth/register">Create an account</a></p>
    <p><a href="/">Back to Pitchside</a></p>
</main>

<script>
const form = document.getElementById("login-form");
const button = document.getElementById("login-button");
const message = document.getElementById("message");

const passwordInput = document.querySelector('input[name="password"]');
const togglePassword = document.getElementById("toggle-password");

togglePassword.addEventListener("click", () => {
    const showing = passwordInput.type === "text";

    passwordInput.type = showing ? "password" : "text";
    togglePassword.textContent = showing ? "👁" : "🙈";
    togglePassword.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    togglePassword.setAttribute("aria-pressed", String(!showing));
});
function showMessage(text, isError) {
    message.textContent = text;
    message.className = isError ? "error" : "";
}

/* Only allow redirects to pages on this site. */
function safeNextUrl() {
    const next = new URLSearchParams(window.location.search).get("next");

    if (next && next.startsWith("/") && !next.startsWith("//") && !next.includes("\\")) {
        return next;
    }

    return "/";
}

/* Turn whatever the server sent into one readable sentence. */
function errorText(status, result) {
    if (status === 422) {
        return "Username must be 3 to 30 letters, numbers or underscores, " +
               "and the password at least 8 characters.";
    }

    if (result && typeof result.detail === "string") {
        return result.detail;
    }

    return "Login failed. Please try again.";
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const data = Object.fromEntries(new FormData(form));
    data.username = data.username.trim();

    button.disabled = true;
    button.textContent = "Logging in...";
    showMessage("Logging in, please wait...", false);

    /* If the server is slow, say so instead of looking frozen. */
    const slowTimer = setTimeout(() => {
        showMessage("The server is taking a while to respond. Please keep waiting...", false);
    }, 4000);

    try {
        const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(data)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            showMessage(errorText(response.status, result), true);
            return;
        }

        showMessage("Success! Opening Pitchside...", false);
        window.location.href = safeNextUrl();

    } catch {
        showMessage("Could not reach the server. Check your internet connection and try again.", true);

    } finally {
        clearTimeout(slowTimer);
        button.disabled = false;
        button.textContent = "Log in";
    }
});
</script>
</body>
</html>
