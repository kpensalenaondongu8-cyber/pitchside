<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset password | Pitchside</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 16px;
        }

        main {
            box-sizing: border-box;
            background: #1c2935;
            padding: 24px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
        }

        h1 { font-size: 1.5rem; margin: 0 0 8px; }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }

        input { border: 1px solid #52616b; }

        button {
            background: #35b86b;
            color: white;
            border: 0;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; cursor: wait; }

        #message { overflow-wrap: anywhere; min-height: 20px; }
        #message.error { color: #ff8a80; }
        a { color: #65d995; }

        .password-wrap { position: relative; margin-top: 12px; }
        .password-wrap input { margin-top: 0; padding-right: 48px; }
        .toggle-password {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px 10px;
            background: transparent;
            color: #aab8c4;
            font-size: 18px;
        }

        input::-ms-reveal { display: none; }
    </style>
</head>
<body>
<main>
    <h1>Choose a new password</h1>
    <p>Pick a password you will remember. At least 8 characters.</p>

    <form id="reset-form">
        <div class="password-wrap">
            <input id="password" type="password" placeholder="New password"
                   minlength="8" maxlength="128" autocomplete="new-password" required>
            <button type="button" class="toggle-password" id="toggle-password"
                    aria-label="Show password" aria-pressed="false">👁</button>
        </div>

        <input id="confirm" type="password" placeholder="Repeat the new password"
               minlength="8" maxlength="128" autocomplete="new-password" required>

        <button id="reset-button" type="submit">Change password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p id="done" hidden><a href="/auth/login">Go to log in</a></p>
</main>

<script>
const token = new URLSearchParams(window.location.search).get("token");

/* Remove the token from the address bar so it is not left in the browser history. */
if (token) window.history.replaceState(null, "", "/auth/reset");

const form = document.getElementById("reset-form");
const button = document.getElementById("reset-button");
const message = document.getElementById("message");
const password = document.getElementById("password");
const confirmBox = document.getElementById("confirm");
const toggle = document.getElementById("toggle-password");

function showMessage(text, isError) {
    message.textContent = text;
    message.className = isError ? "error" : "";
}

if (!token) {
    form.hidden = true;
    showMessage("This page needs a reset link from an admin.", true);
}

toggle.addEventListener("click", () => {
    const showing = password.type === "text";
    const type = showing ? "password" : "text";

    password.type = type;
    confirmBox.type = type;
    toggle.textContent = showing ? "👁" : "🙈";
    toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    toggle.setAttribute("aria-pressed", String(!showing));
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (password.value !== confirmBox.value) {
        showMessage("The two passwords do not match.", true);
        return;
    }

    button.disabled = true;
    button.textContent = "Changing...";
    showMessage("Please wait...", false);

    try {
        const response = await fetch("/auth/reset", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, password: password.value }),
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            if (response.status === 422) {
                showMessage("The password must be 8 to 128 characters.", true);
            } else {
                showMessage(
                    typeof result.detail === "string" ? result.detail : "Could not change the password.",
                    true
                );
            }
            return;
        }

        form.hidden = true;
        showMessage("Your password has been changed. Please log in with the new one.", false);
        document.getElementById("done").hidden = false;

    } catch (error) {
        showMessage("Could not reach the server. Check your internet connection and try again.", true);

    } finally {
        button.disabled = false;
        button.textContent = "Change password";
    }
});
</script>
</body>
</html>
