<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Messages | Pitchside</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: #f5f7fa;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 22px;
            background: #182630;
            border-bottom: 1px solid #2d3b46;
        }

        header h1 {
            margin: 0;
            color: #54e38e;
            font-size: 22px;
        }

        header a {
            color: #54e38e;
            text-decoration: none;
        }

        header a:hover {
            text-decoration: underline;
        }

        .container {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 18px;
            max-width: 1200px;
            height: calc(100dvh - 75px);
            min-height: 400px;
            margin: 0 auto;
            padding: 18px;
        }

        .sidebar,
        .chat-panel {
            min-width: 0;
            background: #182630;
            border: 1px solid #2d3b46;
            border-radius: 12px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-top {
            flex-shrink: 0;
            padding: 16px;
            border-bottom: 1px solid #2d3b46;
        }

        .sidebar-top h2 {
            margin: 0;
            font-size: 18px;
        }

        #conversation-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .conversation {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: left;
            color: #f5f7fa;
            background: transparent;
            border: 0;
            border-bottom: 1px solid #2d3b46;
            cursor: pointer;
        }

        .conversation:hover,
        .conversation.active {
            background: #253943;
        }

        .conversation strong {
            display: block;
            overflow-wrap: anywhere;
        }

        .conversation small {
            display: block;
            margin-top: 5px;
            color: #aab8c2;
            font-weight: normal;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            flex-shrink: 0;
            padding: 17px;
            border-bottom: 1px solid #2d3b46;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        #status {
            margin-top: 7px;
            color: #aab8c2;
            font-size: 13px;
        }

        /* The message area is a vertical flex container. */
        #messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            padding: 18px;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .empty-state {
            margin: auto;
            color: #aab8c2;
            text-align: center;
            line-height: 1.6;
        }

        /*
         * Incoming messages stay on the left.
         * Explicit width and margin rules make the alignment clearer.
         */
        .message {
            display: block;
            flex: 0 0 auto;
            width: fit-content;
            max-width: 80%;
            min-width: 60px;
            align-self: flex-start;
            margin-right: auto;
            margin-left: 0;
            padding: 11px 13px;
            background: #253943;
            border-radius: 12px 12px 12px 3px;
            overflow-wrap: anywhere;
        }

        /*
         * Messages sent by the logged-in user go on the right.
         */
        .message.mine {
            align-self: flex-end;
            margin-right: 0;
            margin-left: auto;
            background: #176b45;
            border-radius: 12px 12px 3px 12px;
        }

        .message .sender {
            margin-bottom: 5px;
            color: #aeeec8;
            font-size: 12px;
            font-weight: bold;
        }

        .message .text {
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .message time {
            display: block;
            margin-top: 7px;
            color: #d0ded7;
            font-size: 11px;
            text-align: right;
        }

        #message-form {
            display: flex;
            flex-shrink: 0;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #2d3b46;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            color: #f5f7fa;
            background: #101820;
            border: 1px solid #3b4d59;
            border-radius: 8px;
            outline: none;
        }

        #message-input:focus {
            border-color: #54e38e;
        }

        #send-button {
            color: #102018;
            background: #54e38e;
            border: 0;
            border-radius: 7px;
            padding: 11px 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #send-button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .notice {
            padding: 10px 14px;
            color: #f5d58b;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            header {
                padding: 14px;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100dvh - 60px);
                padding: 10px;
                gap: 10px;
            }

            .sidebar {
                flex: none;
                max-height: 220px;
            }

            .sidebar-top {
                padding: 12px;
            }

            #conversation-list {
                min-height: 0;
            }

            .chat-panel {
                flex: 1;
                min-height: 55dvh;
            }

            #messages {
                padding: 12px;
            }

            .message {
                max-width: 90%;
            }

            #message-form {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Pitchside</h1>

    <nav>
        <a href="/">Matches</a>
        &nbsp; | &nbsp;
        <a href="/chat">Group Chat</a>
    </nav>
</header>

<main class="container">

    <aside class="sidebar">
        <div class="sidebar-top">
            <h2>Private Messages</h2>
        </div>

        <div id="conversation-list">
            <p class="notice">Loading conversations...</p>
        </div>
    </aside>

    <section class="chat-panel">

        <div class="chat-header">
            <h2 id="chat-title">Select a conversation</h2>
            <div id="status">Your private messages appear here.</div>
        </div>

        <div id="messages" aria-live="polite">
            <p class="empty-state">
                Choose a conversation to view your messages.
            </p>
        </div>

        <div id="notice" class="notice" role="status"></div>

        <form id="message-form">
            <input
                id="message-input"
                type="text"
                maxlength="1000"
                placeholder="Write a message..."
                autocomplete="off"
                aria-label="Your message"
                disabled
                required
            >

            <button id="send-button" type="submit" disabled>
                Send
            </button>
        </form>

    </section>

</main>

<script>
    const conversationList = document.getElementById(
        "conversation-list"
    );

    const messagesContainer = document.getElementById("messages");
    const chatTitle = document.getElementById("chat-title");
    const statusText = document.getElementById("status");
    const notice = document.getElementById("notice");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");

    let currentUser = null;
    let activeConversationId = null;
    let conversations = [];
    let refreshTimer = null;

    // Prevent overlapping message requests for the same conversation.
    const loadingConversations = new Set();

    // Remember the last displayed message data to avoid unnecessary redraws.
    let lastMessagesSignature = null;


    // Make API requests and handle authentication errors.
    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            credentials: "same-origin",
            ...options,
            headers: {
                ...(options.headers || {}),
            },
        });

        if (response.status === 401) {
            window.location.href =
                "/auth/login?next=/private/messages";

            throw new Error("Please log in again.");
        }

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.detail || "Something went wrong."
            );
        }

        return data;
    }


    // Display a notice to the user.
    function showNotice(message) {
        notice.textContent = message;
    }


    // Compare IDs consistently, even if one is a string.
    function sameId(first, second) {
        return (
            first !== null &&
            first !== undefined &&
            second !== null &&
            second !== undefined &&
            String(first) === String(second)
        );
    }


    // Format a message timestamp.
    function formatTime(value) {
        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString();
    }


    // Display conversations in the sidebar.
    function renderConversations() {
        conversationList.replaceChildren();

        if (conversations.length === 0) {
            const empty = document.createElement("p");

            empty.className = "notice";
            empty.textContent = "No conversations yet.";

            conversationList.appendChild(empty);
            return;
        }

        for (const conversation of conversations) {
            const button = document.createElement("button");

            button.type = "button";
            button.className = "conversation";

            if (sameId(conversation.id, activeConversationId)) {
                button.classList.add("active");
            }

            const username = document.createElement("strong");

            username.textContent =
                conversation.other_user?.username || "User";

            const subtitle = document.createElement("small");

            subtitle.textContent = "Private conversation";

            button.append(username, subtitle);

            button.addEventListener("click", async () => {
                await openConversation(conversation.id);
            });

            conversationList.appendChild(button);
        }
    }


    // Load the current user's conversations.
    async function loadConversations() {
        const data = await apiRequest("/private/conversations");

        conversations = Array.isArray(data.conversations)
            ? data.conversations
            : [];

        renderConversations();
    }


    /*
     * Identify the message sender.
     *
     * First, compare the user IDs.
     * If the IDs are missing or don't match, check the sender's username
     * against the logged-in username as a fallback.
     */
    function isOwnMessage(message) {
        if (!currentUser) {
            return false;
        }

        const senderId =
            message.sender_id ??
            message.user_id ??
            message.sender?.id;

        if (sameId(senderId, currentUser.id)) {
            return true;
        }

        const senderUsername =
            message.username ??
            message.sender_username ??
            message.sender?.username;

        return Boolean(
            senderUsername &&
            currentUser.username &&
            senderUsername.toLowerCase() ===
                currentUser.username.toLowerCase()
        );
    }


    // Load and display messages in the selected conversation.
    async function loadMessages() {
        if (activeConversationId === null) {
            return;
        }

        const conversationId = activeConversationId;
        const conversationKey = String(conversationId);

        // Don't send another request while this conversation is loading.
        if (loadingConversations.has(conversationKey)) {
            return;
        }

        loadingConversations.add(conversationKey);

        try {
            const data = await apiRequest(
                `/private/conversations/${conversationId}/messages`
            );

            // The user might have switched conversations while waiting.
            if (!sameId(conversationId, activeConversationId)) {
                return;
            }

            const messages = Array.isArray(data.messages)
                ? data.messages
                : [];

            /*
             * Only redraw the message list when its data changes.
             * This prevents the interface from repeatedly flickering.
             */
            const signature = JSON.stringify(messages);

            if (signature === lastMessagesSignature) {
                return;
            }

            const wasAtBottom =
                messagesContainer.scrollHeight -
                messagesContainer.scrollTop -
                messagesContainer.clientHeight < 100;

            const hadMessages =
                messagesContainer.querySelector(".message") !== null;

            messagesContainer.replaceChildren();

            if (messages.length === 0) {
                const empty = document.createElement("p");

                empty.className = "empty-state";
                empty.textContent = "No messages yet. Say hello!";

                messagesContainer.appendChild(empty);

                lastMessagesSignature = signature;
                return;
            }

            for (const message of messages) {
                const bubble = document.createElement("div");

                bubble.className = "message";

                const mine = isOwnMessage(message);

                if (mine) {
                    bubble.classList.add("mine");
                }

                const sender = document.createElement("div");

                sender.className = "sender";

                sender.textContent = mine
                    ? "You"
                    : (
                        message.username ||
                        message.sender_username ||
                        message.sender?.username ||
                        "User"
                    );

                const text = document.createElement("div");

                text.className = "text";
                text.textContent = message.message ?? "";

                const time = document.createElement("time");

                time.textContent = formatTime(message.created_at);

                bubble.append(sender, text, time);

                messagesContainer.appendChild(bubble);
            }

            lastMessagesSignature = signature;

            // Scroll down when opening a chat or when already near the bottom.
            if (!hadMessages || wasAtBottom) {
                messagesContainer.scrollTop =
                    messagesContainer.scrollHeight;
            }

        } finally {
            loadingConversations.delete(conversationKey);
        }
    }


    // Open a conversation and refresh its messages periodically.
    async function openConversation(conversationId) {
        activeConversationId = conversationId;

        // Force the selected conversation to render its own messages.
        lastMessagesSignature = null;

        const conversation = conversations.find(
            item => sameId(item.id, conversationId)
        );

        chatTitle.textContent = conversation
            ? conversation.other_user?.username || "Private Conversation"
            : "Private Conversation";

        messageInput.disabled = false;
        sendButton.disabled = false;

        statusText.textContent = "Private conversation";
        showNotice("");

        renderConversations();

        if (refreshTimer !== null) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }

        // Load messages immediately instead of waiting for the timer.
        try {
            await loadMessages();
        } catch (error) {
            showNotice(error.message);
        }

        // Check for new messages every second.
        refreshTimer = setInterval(async () => {
            try {
                await loadMessages();
            } catch (error) {
                showNotice(error.message);
            }
        }, 1000);
    }


    // Find an existing conversation or create one using a user ID.
    async function openConversationWithUser(userId) {
        const numericUserId = Number(userId);

        if (
            !Number.isInteger(numericUserId) ||
            numericUserId <= 0
        ) {
            showNotice("The selected user ID is invalid.");
            return;
        }

        if (sameId(numericUserId, currentUser.id)) {
            showNotice("You cannot message yourself.");
            return;
        }

        try {
            showNotice("Opening private conversation...");

            const data = await apiRequest(
                `/private/conversations?other_user_id=${encodeURIComponent(numericUserId)}`,
                {
                    method: "POST",
                }
            );

            await loadConversations();

            await openConversation(data.id);

            // Remove the selected user ID from the address bar.
            window.history.replaceState(
                {},
                "",
                "/private/messages"
            );

        } catch (error) {
            showNotice(error.message);
        }
    }


    // Send a private message.
    messageForm.addEventListener("submit", async event => {
        event.preventDefault();

        if (activeConversationId === null) {
            showNotice("Select a conversation first.");
            return;
        }

        const message = messageInput.value.trim();

        if (!message) {
            showNotice("Enter a message first.");
            return;
        }

        const conversationId = activeConversationId;

        sendButton.disabled = true;
        showNotice("");

        try {
            await apiRequest(
                `/private/conversations/${conversationId}/messages`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: message,
                    }),
                }
            );

            messageInput.value = "";

            // Display the sent message immediately after the server accepts it.
            lastMessagesSignature = null;
            await loadMessages();

        } catch (error) {
            showNotice(error.message);

        } finally {
            sendButton.disabled =
                activeConversationId === null;

            if (activeConversationId !== null) {
                messageInput.focus();
            }
        }
    });


    // Initialise the page.
    async function initialise() {
        try {
    const userData = await apiRequest("/auth/me");
    currentUser = userData.user;
            await loadConversations();

            // Check whether Group Chat sent us a selected user ID.
            const urlParams = new URLSearchParams(
                window.location.search
            );

            const selectedUserId = urlParams.get("user_id");

            if (selectedUserId !== null) {
                await openConversationWithUser(selectedUserId);
                return;
            }

            // Open the first existing conversation if one is available.
            if (conversations.length > 0) {
                await openConversation(conversations[0].id);
            }

        } catch (error) {
            showNotice(error.message);
        }
    }


    initialise();


    // Stop polling when the user leaves the page.
    window.addEventListener("beforeunload", function () {
        if (refreshTimer !== null) {
            clearInterval(refreshTimer);
        }
    });
</script>

</body>
</html>
